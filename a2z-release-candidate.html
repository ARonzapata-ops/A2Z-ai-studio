<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A2Z Creative Studio</title><meta name="theme-color" content="#101322"><style>*{box-sizing:border-box}body{margin:0;background:#101322;color:#f5f5ff;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:650px;margin:auto;padding:22px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:30px;line-height:1.12}p,small{color:#b9bfd3;line-height:1.5}.ey{color:#aab7ff;font-size:12px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.option{border:1px solid #414968;border-radius:17px;background:#20263b;color:white;padding:20px;text-align:left;font:inherit;cursor:pointer}.tile{min-height:130px}.tile b,.tile span{display:block;margin-top:10px}.option{width:100%;margin:5px 0}.selected{border:2px solid #aab7ff;background:#303b62}.bar{height:6px;background:#313a52;border-radius:10px;overflow:hidden;margin:22px 0}.bar i{display:block;height:100%;background:#aab7ff}button.primary{background:#aab7ff;color:#11172b;border:0;border-radius:13px;padding:15px 20px;font-weight:800;cursor:pointer}button.secondary{background:#252d45;color:white;border:1px solid #4a5675;border-radius:13px;padding:15px;cursor:pointer}.actions{display:flex;gap:9px;margin-top:22px}.actions button{flex:1}input,textarea,select{width:100%;border:1px solid #53617f;background:#20283d;border-radius:12px;color:white;padding:14px;font:inherit;margin:8px 0 15px}textarea{min-height:150px}label{display:block;font-weight:700;margin-top:12px}.notice{padding:15px;border:1px solid #46516b;border-radius:13px;background:#1b2235;margin:16px 0}a{color:#bbc7ff}#status{white-space:pre-wrap}canvas{width:100%;border-radius:12px;background:#151a2b}audio,video{width:100%;margin-top:10px}</style></head><body><main><header><b>✦ A2Z const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), names=['Make Music','Make a Video','Tell a Story','Create Artwork'], icons=['🎵','🎬','📖','🎨'], prompts=[['What are we making?','Song lyrics','A vocal project','Music concept'],['What video are we making?','Music video / lyric video','Photo slideshow','Social media reel'],['What kind of story?','Short story','Script','Personal story'],['What kind of artwork?','Quote poster','Cover art','Social graphic']];let s;try{s=JSON.parse(localStorage.getItem('a2z-release-v1'))}catch(e){}s=s||{page:0,type:1,choice:0,title:'',content:'',style:'Dark cinematic',duration:30};function save(){localStorage.setItem('a2z-release-v1',JSON.stringify(s))}function go(p){s.page=p;save();render()}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}function safeName(){return (s.title||'A2Z-project').replace(/[^\w-]+/g,'-').slice(0,50)}function render(){const a=$('#app');if(s.page===0){a.innerHTML='<div class="ey">Welcome to your studio</div><h1>What are we creating today?</h1><p>One choice at a time. Your work saves automatically on this device.</p><div class="grid">'+names.map((n,i)=>`<button class="tile" data-type="${i}"><span style="font-size:29px">${icons[i]}</span><b>${n}</b></button>`).join('')+'</div><p><small>Existing A2Z projects stay in the original studio.</small></p>';a.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{s.type=+b.dataset.type;s.choice=0;go(1)});return}if(s.page===1){a.innerHTML=`<div class="ey">${names[s.type]} • Step 1 of 3</div><div class="bar"><i style="width:33%"></i></div><h1>${prompts[s.type][0]}</h1>`+prompts[s.type].slice(1).map((v,i)=>`<button class="option ${s.choice===i?'selected':''}" data-choice="${i}">${v}</button>`).join('')+'<div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="next">Continue</button></div>';a.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.choice=+b.dataset.choice;save();render()});$('#back').onclick=()=>go(0);$('#next').onclick=()=>go(2);return}if(s.page===2){a.innerHTML=`<div class="ey">${names[s.type]} • Step 2 of 3</div><div class="bar"><i style="width:66%"></i></div><h1>Bring your idea to life</h1><label>Project name</label><input id="title" placeholder="My new creation" value="${esc(s.title)}"><label>${s.type===1?'Words to show in your video':s.type===3?'Words to feature in your artwork':s.type===0?'Lyrics or song idea':'Your story or script'}</label><textarea id="content" placeholder="Write or paste your words here...">${esc(s.content)}</textarea><label>Creative style</label><select id="style">${['Dark cinematic','Bright and uplifting','Minimal and clean','Bold and dramatic'].map(v=>`<option ${s.style===v?'selected':''}>${v}</option>`).join('')}</select>${s.type===1?'<label>Video length</label><select id="duration"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option></select><label>Optional audio from your iPhone</label><input type="file" id="audiofile" accept="audio/*"><p><small>Audio is used locally; it is not uploaded. Video export availability depends on your browser.</small></p>':''}<div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="next">Review & create</button></div>`;$('#title').oninput=e=>{s.title=e.target.value;save()};$('#content').oninput=e=>{s.content=e.target.value;save()};$('#style').onchange=e=>{s.style=e.target.value;save()};if(s.type===1){$('#duration').value=String(s.duration);$('#duration').onchange=e=>{s.duration=+e.target.value;save()};window.a2zAudioFile=null;$('#audiofile').onchange=e=>{window.a2zAudioFile=e.target.files[0]}}$('#back').onclick=()=>go(1);$('#next').onclick=()=>go(3);return}a.innerHTML=`<div class="ey">${names[s.type]} • Step 3 of 3</div><div class="bar"><i style="width:100%"></i></div><h1>${esc(s.title||'Your creation')}</h1><div class="notice"><b>${esc(prompts[s.type][s.choice+1])}</b><p>${esc(s.style)} • ${s.type===1?s.duration+' seconds': 'Ready to export'}</p><p>${esc(s.content||'No content entered yet.')}</p></div><div id="output"></div><div class="actions"><button class="secondary" id="back">Edit</button><button class="primary" id="create">${s.type===1?'Create video':'Create & download'}</button></div><p><small>This release exports your own text, designs, and basic videos. It does not claim to generate AI images, AI-written stories, or synthesized songs. For voice synthesis and existing projects, use the original studio.</small></p><p><a href="./index.html">Open original A2Z voice studio</a></p>`;$('#back').onclick=()=>go(2);$('#create').onclick=create}
function create(){const out=$('#output');if(s.type===0||s.type===2){let text=`${s.title||'Untitled'}\n${prompts[s.type][s.choice+1]}\nStyle: ${s.style}\n\n${s.content}\n`;download(new Blob([text],{type:'text/plain'}),safeName()+'.txt');out.textContent='Your file is ready. Check Downloads.';return}if(s.type===3){let t=esc(s.content||s.title||'A2Z'),bg=s.style==='Bright and uplifting'?'#e9ecff':s.style==='Minimal and clean'?'#f7f7f7':'#141829',fg=bg==='#141829'?'#ffffff':'#161c2b',lines=(s.content||s.title||'A2Z').match(/.{1,28}(\s|$)/g)||['A2Z'];let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="${bg}"/><rect x="70" y="70" width="940" height="940" rx="28" fill="none" stroke="#929bd0" stroke-width="4"/><text x="540" y="160" font-family="Arial" font-size="32" text-anchor="middle" fill="${fg}">A2Z STUDIO</text>${lines.slice(0,12).map((l,i)=>`<text x="540" y="${360+i*60}" text-anchor="middle" font-size="45" font-family="Arial" fill="${fg}">${esc(l.trim())}</text>`).join('')}</svg>`;download(new Blob([svg],{type:'image/svg+xml'}),safeName()+'.svg');out.textContent='Your editable vector artwork was downloaded.';return}makeVideo(out)}
async function makeVideo(out){out.textContent='Preparing your video...';if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){out.innerHTML='<p>Video export is not supported by this browser. Your project is saved. Open the original A2Z editor to export a video.</p>';return}let canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;let ctx=canvas.getContext('2d'),fps=12,stream=canvas.captureStream(fps),mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){out.textContent='No supported video format here. Your project is saved.';return}let chunks=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1500000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=e=>{out.textContent='Video export error: '+e.error?.message};rec.onstop=()=>{let ext=mime.includes('mp4')?'mp4':'webm';download(new Blob(chunks,{type:mime}),safeName()+'.'+ext);out.textContent='Video export finished. Check Downloads.';stream.getTracks().forEach(t=>t.stop())};let start=performance.now(),duration=s.duration*1000,lines=(s.content||s.title||'A2Z').split(/\n/).filter(Boolean);function draw(now){let progress=Math.min(1,(now-start)/duration);ctx.fillStyle=s.style==='Bright and uplifting'?'#e6dfff':'#111628';ctx.fillRect(0,0,720,1280);ctx.fillStyle=s.style==='Bright and uplifting'?'#252040':'#fff';ctx.textAlign='center';ctx.font='bold 46px system-ui';ctx.fillText((s.title||'A2Z').slice(0,24),360,170);ctx.font='bold 39px system-ui';let line=lines[Math.min(lines.length-1,Math.floor(progress*lines.length))]||'A2Z';let words=line.match(/.{1,25}(\s|$)/g)||[line];words.slice(0,7).forEach((w,i)=>ctx.fillText(w.trim(),360,560+i*55));ctx.fillStyle='#9baaff';ctx.fillRect(70,1160,580*progress,8);ctx.font='22px system-ui';ctx.fillText('CREATED WITH A2Z',360,1220);if(progress<1)requestAnimationFrame(draw);else setTimeout(()=>rec.state==='recording'&&rec.stop(),350)}rec.start(1000);requestAnimationFrame(draw);out.textContent='Rendering '+s.duration+'-second text video. Keep this page open until the download starts.'}
render();</script></body></html>
