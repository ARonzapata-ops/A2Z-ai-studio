<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A2Z Guided Studio</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f16;color:#f4f5ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}header strong{font-size:22px}header span{color:#aab0cc;font-size:13px}.eyebrow{color:#a9b4ff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}h1{font-size:31px;line-height:1.14;margin:14px 0}p{color:#adb3c9;line-height:1.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.choice{background:#1c2131;color:white;border:1px solid #343c58;border-radius:18px;padding:22px 14px;text-align:left;min-height:138px;font:inherit}.choice b{display:block;margin:12px 0 5px}.choice small{color:#abb2ca}.choice .emoji{font-size:29px}.choice.selected{border:2px solid #a2aaff;background:#292f50}.stack{display:grid;gap:11px;margin:26px 0}.stack .choice{min-height:65px;padding:18px}.bar{height:6px;background:#292f43;border-radius:8px;overflow:hidden;margin:22px 0}.bar div{height:100%;background:#9ca8ff;transition:width .2s}.actions{display:flex;gap:10px;margin-top:25px}button{cursor:pointer}button.primary{background:#a0aaff;color:#101326;border:0;border-radius:12px;padding:15px 20px;font-weight:800;flex:1}button.secondary{background:#262b3d;color:white;border:1px solid #464d64;border-radius:12px;padding:15px 20px}button:disabled{opacity:.4}textarea,input{width:100%;border:1px solid #515a78;background:#1b2130;border-radius:12px;padding:15px;color:white;font:inherit}textarea{min-height:120px}a{color:#b6beff}.note{font-size:13px;color:#a8aec4}.hidden{display:none}</style></head><body><main><header><strong>✦ A2Z Studio</strong><span>CREATE • EXPLORE • FINISH</span></header><div id="app"></div></main><script>
const paths=[['🎵','Make Music','Songs & vocals'],['🎬','Make a Video','Films & reels'],['📖','Tell a Story','Books & scripts'],['🎨','Create Artwork','Images & designs']];const flows={1:[['What kind of video?','Music video','Short film','Social media reel','Something else'],['How would you like to start?','I have a song or audio','I have pictures or clips','I have a written idea','Help me plan it'],['What look are you going for?','Realistic & cinematic','Animated','Dark & dramatic','Let me decide later'],['How much guidance?','Walk me through everything','Help me make a first draft','Show advanced tools']]};let state=JSON.parse(localStorage.getItem('a2z-guide-v1')||'{"page":0,"path":null,"answers":{},"idea":""}');const save=()=>localStorage.setItem('a2z-guide-v1',JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let a=document.getElementById('app');if(state.page===0){a.innerHTML='<div class="eyebrow">Welcome to your creative space</div><h1>What are we creating today?</h1><p>Pick one to get started. You only need to make one decision at a time.</p><div class="choices">'+paths.map((p,i)=>`<button class="choice" data-path="${i}"><span class="emoji">${p[0]}</span><b>${p[1]}</b><small>${p[2]}</small></button>`).join('')+'</div><p class="note">Your progress is saved on this device. Existing A2Z projects are not changed.</p>';a.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{state.path=+b.dataset.path;state.page=1;save();render()});return}let flow=flows[state.path]||[['What would you like to create?','Start from an idea','Use something I already made','Get help choosing'],['How much guidance would you like?','Walk me through it','Help me make a draft','Advanced tools']];let total=flow.length+2;if(state.page<=flow.length){let i=state.page-1,step=flow[i],selected=state.answers[i];a.innerHTML=`<div class="eyebrow">${esc(paths[state.path][1])} · Step ${state.page} of ${total}</div><div class="bar"><div style="width:${Math.round(state.page/total*100)}%"></div></div><h1>${esc(step[0])}</h1><p>Choose the option that sounds closest. You can change it later.</p><div class="stack">${step.slice(1).map((x,j)=>`<button class="choice ${selected===j?'selected':''}" data-answer="${j}">${esc(x)}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="next" ${selected===undefined?'disabled':''}>Continue →</button></div>`;a.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[i]=+b.dataset.answer;save();render()});a.querySelector('#back').onclick=()=>{state.page--;save();render()};a.querySelector('#next').onclick=()=>{state.page++;save();render()};return}if(state.page===flow.length+1){a.innerHTML=`<div class="eyebrow">Step ${state.page} of ${total}</div><div class="bar"><div style="width:90%"></div></div><h1>Tell us a little about your idea</h1><p>Optional. One sentence is enough. You can add details later.</p><textarea id="idea" placeholder="I want to create…">${esc(state.idea||'')}</textarea><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="next">Review →</button></div>`;a.querySelector('#idea').oninput=e=>{state.idea=e.target.value;save()};a.querySelector('#back').onclick=()=>{state.page--;save();render()};a.querySelector('#next').onclick=()=>{state.page++;save();render()};return}a.innerHTML=`<div class="eyebrow">Review your choices</div><h1>You're ready for the next step.</h1><p>Here's what you chose. Nothing has been generated or charged.</p><div class="stack">${flow.map((s,i)=>`<div class="choice"><small>${esc(s[0])}</small><b>${esc(s[1+(state.answers[i]??0)])}</b></div>`).join('')}</div>${state.idea?`<p><b>Your idea:</b> ${esc(state.idea)}</p>`:''}<p class="note">Next, open the existing A2Z studio to create or export. Your choices are copied into a project brief you can paste into the editor. No credits are spent by this step.</p><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="launch">Open A2Z Studio →</button></div><div class="actions"><button class="secondary" id="copy">Copy my project brief</button><button class="secondary" id="restart">Start over</button></div>`;a.querySelector('#back').onclick=()=>{state.page--;save();render()};const brief=()=>[paths[state.path][1],...flow.map((q,i)=>q[0]+': '+q[1+(state.answers[i]??0)]),'Idea: '+(state.idea||'Not specified')].join('\n');a.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(brief());a.querySelector('#copy').textContent='Copied ✓'}catch(e){prompt('Copy your brief:',brief())}};a.querySelector('#launch').onclick=()=>{localStorage.setItem('a2z-last-creative-brief',brief());location.href='./index.html'};a.querySelector('#restart').onclick=()=>{state={page:0,path:null,answers:{},idea:''};save();render()}}render();
</script></body></html>
