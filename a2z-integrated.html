<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101322"><title>A2Z Studio • Guided Workspace</title><style>*{box-sizing:border-box}body{margin:0;background:#101322;color:#fff;font:15px system-ui,-apple-system}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#14192b;border-bottom:1px solid #343b58}strong{font-size:19px}nav{display:flex;gap:7px}button{background:#272e47;color:#fff;border:1px solid #505a7e;border-radius:11px;padding:10px 12px;font-weight:700}button.active{background:#a4afff;color:#11152a}main{height:calc(100dvh - 66px)}iframe{display:block;border:0;width:100%;height:100%;background:#101322}#studio{display:none}#note{display:none;position:absolute;bottom:16px;left:12px;right:12px;background:#262d48;border:1px solid #7884bd;border-radius:12px;padding:12px;box-shadow:0 6px 24px #0008}#note button{float:right}small{color:#c5c9dc}</style></head><body><header><strong>✦ A2Z Studio</strong><nav><button id="guideBtn" class="active">Create</button><button id="studioBtn">Studio / Export</button></nav></header><main><iframe id="guide" title="Guided creation" src="./a2z-release-candidate-fixed.html"></iframe><iframe id="studio" title="Original media editor" src="./index%20new1.html"></iframe></main><div id="note"><button id="dismiss">×</button><b>Original editor opened</b><div><small>Your guided project and original editor are together in this workspace. Automatic transfer of project fields is not yet supported; use the guide’s download and the editor’s import tools as available.</small></div></div><script>const g=document.getElementById('guide'),s=document.getElementById('studio'),gb=document.getElementById('guideBtn'),sb=document.getElementById('studioBtn'),n=document.getElementById('note');function show(studio){g.style.display=studio?'none':'block';s.style.display=studio?'block':'none';gb.classList.toggle('active',!studio);sb.classList.toggle('active',studio);if(studio&&!sessionStorage.getItem('a2z-note'))n.style.display='block'}gb.onclick=()=>show(false);sb.onclick=()=>show(true);document.getElementById('dismiss').onclick=()=>{n.style.display='none';sessionStorage.setItem('a2z-note','1')};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.a2zOpenStudio)show(true)});</script></body></html>
