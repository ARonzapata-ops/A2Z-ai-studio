play:block;width:100%;max-height:550px}#signVideo{position:absolute;width:30%;right:0;bottom:50px;background:#000;max-height:60%;object-fit:contain}#captionPreview{position:absolute;top:8px;left:4%;width:92%;text-align:center;white-space:pre-wrap;pointer-events:none;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;background:#000d;border-radius:6px}#captionPreview:empty{display:none}.cue{border:1px solid #465575;border-radius:16px;padding:16px;margin:16px 0}.cue .toolbar label{min-width:100px}#accessMessage,#learningMessage{color:#8bf1da;white-space:pre-wrap}input[type=file]{font-size:14px}a{overflow-wrap:anywhere}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003cstrong>✦ A2Z Studio\u003c/strong>\u003cspan>Learn. Create. Include.\u003c/span>\u003c/header>\u003cnav aria-label=\"Main\">\u003ca href=\"./\">Create\u003c/a>\u003ca href=\"./learn.html\">Learn\u003c/a>\u003ca href=\"./accessibility.html\">Accessible video\u003c/a>\u003c/nav>\u003cmain id=\"main\">\u003cp class=\"eyebrow\">A2Z LEARN · STARTER COLLECTION\u003c/p>\u003ch1>A world within reach.\u003c/h1>\u003cp>Any age. Your pace. Start with curiosity and leave with something you made.\u003c/p>\u003cdiv class=\"toolbar\">\u003clabel>Choose your depth\u003cselect id=\"depth\">\u003coption value=\"discover\">Discover · start simply\u003c/option>\u003coption value=\"explore\">Explore · try it yourself\u003c/option>\u003coption value=\"deepen\">Go deeper · investigate\u003c/option>\u003c/select>\u003c/label>\u003clabel>Find a subject\u003cinput id=\"search\" type=\"search\" placeholder=\"Math, art, ASL…\">\u003c/label>\u003c/div>\u003cp id=\"progress\" role=\"status\">\u003c/p>\u003cdiv id=\"lessons\" class=\"lesson-grid\">\u003c/div>\u003csection id=\"lesson\" hidden tabindex=\"-1\">\u003cbutton id=\"closeLesson\">← All subjects\u003c/button>\u003cp id=\"subject\" class=\"eyebrow\">\u003c/p>\u003ch2 id=\"lessonTitle\">\u003c/h2>\u003cp id=\"intro\">\u003c/p>\u003ch3>Try it\u003c/h3>\u003cp id=\"activity\">\u003c/p>\u003ch3>Make it yours\u003c/h3>\u003cp id=\"project\">\u003c/p>\u003cp>\u003ca id=\"resource\" target=\"_blank\" rel=\"noopener noreferrer\">Continue with the learning resource ↗\u003c/a>\u003c/p>\u003cp>External resources have their own content and privacy policies. Younger learners should explore with a trusted adult.\u003c/p>\u003clabel>Private learning notes\u003ctextarea id=\"notes\" rows=\"5\" maxlength=\"20000\" placeholder=\"What did you notice? What would you ask next?\">\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton id=\"saveNotes\">Save notes on this device\u003c/button>\u003cbutton id=\"complete\">Mark activity complete\u003c/button>\u003cbutton id=\"createFromLesson\">Make a studio project\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch2>Your learning, your pace\u003c/h2>\u003cp>Notes and progress stay in this browser. No names, birthdays, or accounts needed. Download a backup before clearing browser data. This starter collection is not a complete school curriculum.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"exportProgress\">Download learning backup\u003c/button>\u003clabel>Restore learning backup\u003cinput id=\"progressFile\" type=\"file\" accept=\".json\">\u003c/label>\u003cbutton id=\"importProgress\">Restore\u003c/button>\u003c/div>\u003cp id=\"learningMessage\" role=\"status\">\u003c/p>\u003c/section>\u003c/main>\u003cscript type=\"module\">const $=id=>document.getElementById(id);const key='a2z-learning-v1';let state={};let selected;let lessons=[];const message=t=>$('learningMessage').textContent=t;\ntry{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{message('Saved progress could not be loaded. You can restore a backup.')}if(!state||Array.isArray(state)||typeof state!=='object')state={};\nfunction save(){try{localStorage.setItem(key,JSON.stringify(state));message('Learning progress saved on this device.')}catch{message('Browser storage unavailable. Download a learning backup to keep your work.')}}\nfunction render(){const q=$('search').value.toLowerCase();$('lessons').replaceChildren();let count=0;lessons.forEach(l=>{if(state[l.id]?.complete)count++;if(!(l.subject+' '+l.title).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='lesson-card';const s=document.createElement('span'),h=document.createElement('strong'),p=document.createElement('p');s.textContent=l.subject+(state[l.id]?.complete?' · Completed':'');h.textContent=l.title;p.textContent=l.intro;b.append(s,h,p);b.onclick=()=>open(l);$('lessons').append(b)});$('progress').textContent=`${count} of ${lessons.length} activities completed. Choose a depth that fits you.`}\nfunction open(l){selected=l;$('lesson').hidden=false;$('lessons').hidden=true;$('subject').textContent=l.subject;$('lessonTitle').textContent=l.title;$('intro').textContent=l.intro;$('activity').textContent=l.steps[$('depth').value];$('project').textContent=l.project;$('resource').href=l.url;$('notes').value=state[l.id]?.notes||'';$('complete').textContent=state[l.id]?.complete?'Mark as still exploring':'Mark activity complete';$('lesson').focus()}\n$('closeLesson').onclick=()=>{$('lesson').hidden=true;$('lessons').hidden=false;render()};$('depth').onchange=()=>{if(selected&&!$('lesson').hidden){state[selected.id]={...state[selected.id],notes:$('notes').value};open(selected)}};$('search').oninput=render;\n$('saveNotes').onclick=()=>{state[selected.id]={...state[selected.id],notes:$('notes').value};save()};$('complete').onclick=()=>{state[selected.id]={notes:$('notes').value,complete:!state[selected.id]?.complete};save();open(selected);render()};\n$('createFromLesson').onclick=()=>{sessionStorage.setItem('a2z-lesson-draft',JSON.stringify({title:selected.title,content:selected.project+'\\n\\n'+$('notes').value}));parent.postMessage({a2zSection:'learning-project'},parent.location.origin)};\nfunction download(value){const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='a2z-learning-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}\n$('exportProgress').onclick=()=>download({format:'a2z-learning-v1',progress:state});$('importProgress').onclick=async()=>{try{const f=$('progressFile').files[0];if(!f||f.size>2000000)throw Error('Choose a learning backup smaller than 2 MB.');const d=JSON.parse(await f.text());if(d.format!=='a2z-learning-v1'||!d.progress||typeof d.progress!=='object'||Array.isArray(d.progress))throw Error('Invalid learning backup.');const clean={};for(const l of lessons){const p=d.progress[l.id];if(p){if(typeof p.notes!=='string'||p.notes.length>20000||(p.complete!==undefined&&typeof p.complete!=='boolean'))throw Error('Invalid learning record.');clean[l.id]={notes:p.notes,complete:!!p.complete}}}state={...state,...clean};save();render();if(selected)open(selected)}catch(e){message(e.message)}};\nPromise.resolve([\n  {\n    \"id\": \"math\",\n    \"subject\": \"Math\",\n    \"title\": \"Fractions through rhythm\",\n    \"intro\": \"A fraction describes equal parts of a whole. Four quarter notes fill a four-beat bar. Two half notes fill the same space.\",\n    \"steps\": {\n      \"discover\": \"Clap four steady beats. Clap only beats one and three on the next round. Both rounds take the same time.\",\n      \"explore\": \"Write three ways to fill four beats using halves, quarters, or eighths. Explain why they take equal time.\",\n      \"deepen\": \"Explore ratios: at 120 beats per minute, one beat lasts 0.5 seconds. Calculate the length of eight four-beat bars.\"\n    },\n    \"project\": \"Make a rhythm pattern and explain its fractions.\",\n    \"url\": \"https://www.khanacademy.org/math\"\n  },\n  {\n    \"id\": \"science\",\n    \"subject\": \"Science\",\n    \"title\": \"Ask, predict, observe\",\n    \"intro\": \"A testable question can be investigated with observations. A prediction says what you expect; evidence helps you revise it.\",\n    \"steps\": {\n      \"discover\": \"Fold two paper shapes. Predict which travels farther when gently tossed in a clear space. Use the same starting point.\",\n      \"explore\": \"Repeat each trial three times. Measure distance. Keep paper size and throwing position the same; discuss what you could not control.\",\n      \"deepen\": \"Compare averages and variation. Why might a larger number of trials strengthen your conclusion without proving it forever?\"\n    },\n    \"project\": \"Draw or film a report separating prediction, observation, and explanation.\",\n    \"url\": \"https://www.nasa.gov/learning-resources/\"\n  },\n  {\n    \"id\": \"art\",\n    \"subject\": \"Art\",\n    \"title\": \"Shapes tell stories\",\n    \"intro\": \"Lines, shapes, spacing, and color can guide attention. People may interpret the same picture differently.\",\n    \"steps\": {\n      \"discover\": \"Draw a character using three shapes. Change the shapes to show another feeling.\",\n      \"explore\": \"Create two versions of one scene. Change contrast and composition; ask someone where they looked first.\",\n      \"deepen\": \"Study how cultural context changes interpretation. Compare your intention with a viewer\\u2019s response; neither replaces the other.\"\n    },\n    \"project\": \"Create a poster and describe three choices you made.\",\n    \"url\": \"https://learninglab.si.edu/\"\n  },\n  {\n    \"id\": \"world\",\n    \"subject\": \"The world\",\n    \"title\": \"A map is a point of view\",\n    \"intro\": \"Maps represent places. A map\\u2019s symbols, scale, and purpose influence what it shows and leaves out.\",\n    \"steps\": {\n      \"discover\": \"Draw a map from one room to another. Include a symbol key. Do not share your home address.\",\n      \"explore\": \"Map an imaginary town. Add a scale and calculate the distance between two landmarks.\",\n      \"deepen\": \"Compare two world map projections. Investigate which properties each preserves and distorts. Ask who created each map and why.\"\n    },\n    \"project\": \"Tell a story about a place from two characters\\u2019 perspectives.\",\n    \"url\": \"https://www.loc.gov/maps/\"\n  },\n  {\n    \"id\": \"self\",\n    \"subject\": \"Know yourself\",\n    \"title\": \"Notice, name, choose\",\n    \"intro\": \"Feelings give information, but they do not decide your actions. You can notice a feeling, name it, and choose a next step.\",\n    \"steps\": {\n      \"discover\": \"Draw weather that matches how you feel. You may keep it private or skip the activity.\",\n      \"explore\": \"Describe a moment as observation, feeling, need, and possible next step. Avoid guessing what someone else thinks.\",\n      \"deepen\": \"Consider how values, habits, and circumstances shape decisions. Write two possible responses to one situation and their likely effects.\"\n    },\n    \"project\": \"Write a poem, drawing, or private reflection about something you value. This is reflection, not diagnosis or therapy.\",\n    \"url\": \"https://www.unicef.org/parenting/mental-health\"\n  },\n  {\n    \"id\": \"story\",\n    \"subject\": \"Words & music\",\n    \"title\": \"Build a story that moves\",\n    \"intro\": \"A character wants something, meets an obstacle, and makes a choice. A story can be true, imagined, spoken, written, or signed.\",\n    \"steps\": {\n      \"discover\": \"Tell a three-part story: beginning, something changes, ending.\",\n      \"explore\": \"Write the same event from two points of view. Give each character a different goal.\",\n      \"deepen\": \"Rewrite a scene as a song or visual sequence. Explain what changes when the audience cannot hear its soundtrack.\"\n    },\n    \"project\": \"Create a story with a transcript and meaningful sound descriptions.\",\n    \"url\": \"https://www.loc.gov/programs/poetry-and-literature/\"\n  },\n  {\n    \"id\": \"asl\",\n    \"subject\": \"Sign language\",\n    \"title\": \"Begin with ASL & Deaf culture\",\n    \"intro\": \"ASL is a complete visual language with its own grammar. Facial expression, movement, and space carry meaning. Sign languages are not universal.\",\n    \"steps\": {\n      \"discover\": \"Open ASL University\\u2019s visual lessons with a trusted adult when appropriate. Observe how the signer uses face, hands, and space.\",\n      \"explore\": \"Practice introductions using the teacher\\u2019s visual examples. Watch the whole movement; written word lists alone do not teach signs.\",\n      \"deepen\": \"Compare a signed story and an English transcript. Ask a fluent Deaf teacher how meaning and expression differ. Do not assume word-for-word substitution works.\"\n    },\n    \"project\": \"Plan an accessible story. Work with a fluent signer; include captions for people who prefer text. No automated signing is provided here.\",\n    \"url\": \"https://www.lifeprint.com/asl101/lessons/index.htm\"\n  }\n]).then(l=>{lessons=l;render()}).catch(e=>message(e.message));\n\ndocument.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const sections={'./':'create','./learn.html':'learn','./accessibility.html':'accessibility'};const target=sections[a.getAttribute('href')];if(target){e.preventDefault();parent.postMessage({a2zSection:target},parent.location.origin)}});\u003c/script>\u003c/body>\u003c/html>", "accessibility": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Accessible video · A2Z\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#101426;color:#f4f6ff;font:16px system-ui,-apple-system,sans-serif}header{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#1b2138}header span{font-size:12px;color:#b6c2e4}main extarea:focus-visible,select:focus-visible{outline:3px solid #8bf1da;outline-offset:4px}.skip{position:absolute;left:0;top:-100px;background:#101426;padding:15px;z-index:5}.skip:focus{top:0}#stage{position:relative;background:#050713;border:1px solid #58658c;border-radius:16px;overflow:hidden;min-height:180px}#mainVideo{display:block;width:100%;max-height:550px}#signVideo{position:absolute;width:30%;right:0;bottom:50px;background:#000;max-height:60%;object-fit:contain}#captionPreview{position:absolute;top:8px;left:4%;width:92%;text-align:center;white-space:pre-wrap;pointer-events:none;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;background:#000d;border-radius:6px}#captionPreview:empty{display:none}.cue{border:1px solid #465575;border-radius:16px;padding:16px;margin:16px 0}.cue .toolbar label{min-width:100px}#accessMessage,#learningMessage{color:#8bf1da;white-space:pre-wrap}input[type=file]{font-size:14px}a{overflow-wrap:anywhere}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003cstrong>✦ A2Z Studio\u003c/strong>\u003cspan>Learn. Create. Include.\u003c/span>\u003c/header>\u003cnav aria-label=\"Main\">\u003ca href=\"./\">Create\u003c/a>\u003ca href=\"./learn.html\">Learn\u003c/a>\u003ca href=\"./accessibility.html\">Accessible video\u003c/a>\u003c/nav>\u003cmain id=\"main\">\u003cp class=\"eyebrow\">ACCESSIBLE ART · HUMAN EXPRESSION\u003c/p>\u003ch1>Let more people into the story.\u003c/h1>\u003cp>Add captions and preview your video with a human signer. Media stays on your device; select it again when reopening a workspace. This tool does not translate speech into signs.\u003c/p>\u003clabel>Workspace title\u003cinput id=\"workspaceTitle\" maxlength=\"160\" value=\"My accessible story\">\u003c/label>\u003cdiv class=\"toolbar\">\u003clabel>Main video\u003cinput id=\"mainFile\" type=\"file\" accept=\"video/*\">\u003c/label>\u003clabel>Human signer video (optional)\u003cinput id=\"signFile\" type=\"file\" accept=\"video/*\">\u003c/label>\u003c/div>\u003cdiv id=\"stage\">\u003cvideo id=\"mainVideo\" controls playsinline preload=\"metadata\" aria-label=\"Main video\">\u003c/video>\u003cvideo id=\"signVideo\" muted playsinline preload=\"metadata\" aria-label=\"Human signer\" hidden>\u003c/video>\u003cdiv id=\"captionPreview\">\u003c/div>\u003c/div>\u003cp>Use the main video controls to play and seek both videos. Keep the signer’s hands and face fully visible. Captions appear above the signer to avoid overlap.\u003c/p>\u003cdiv class=\"toolbar\">\u003clabel>Signer starts at main-video second\u003cinput id=\"offset\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\">\u003c/label>\u003clabel>Signer size\u003cselect id=\"signSize\">\u003coption value=\"30\">30%\u003c/option>\u003coption value=\"40\">40%\u003c/option>\u003coption value=\"50\">50%\u003c/option>\u003c/select>\u003c/label>\u003clabel>Signer position\u003cselect id=\"signPosition\">\u003coption value=\"right\">Right\u003c/option>\u003coption value=\"left\">Left\u003c/option>\u003c/select>\u003c/label>\u003clabel>Caption size\u003cselect id=\"captionSize\">\u003coption value=\"20\">Standard\u003c/option>\u003coption value=\"28\">Large\u003c/option>\u003coption value=\"36\">Extra large\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003ch2>Captions & meaningful sounds\u003c/h2>\u003cp>Use seconds for timing. Include speaker names and useful sounds, such as [quiet piano] or [door closes]. Review the full playback before sharing. No automatic transcription is connected.\u003c/p>\u003clabel>Import SRT or WebVTT\u003cinput id=\"captionFile\" type=\"file\" accept=\".srt,.vtt,text/vtt\">\u003c/label>\u003cbutton id=\"importCaptions\">Import captions\u003c/button>\u003cdiv id=\"cues\">\u003c/div>\u003cbutton id=\"addCue\">Add caption\u003c/button>\u003cp id=\"accessMessage\" role=\"status\">\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"downloadVtt\">Download WebVTT\u003c/button>\u003cbutton id=\"downloadSrt\">Download SRT\u003c/button>\u003cbutton id=\"downloadTranscript\">Download transcript\u003c/button>\u003c/div>\u003ch2>Keep working\u003c/h2>\u003cp>Workspace files contain text, timing, media filenames, and layout settings—not the video files. Keep original videos alongside your downloads. Sidecar captions can be used in compatible video players and editors. The signer layout is a synchronized preview; a combined MP4 export is not available in this version.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"downloadWorkspace\">Download workspace\u003c/button>\u003cbutton id=\"saveWorkspace\">Save workspace on this device\u003c/button>\u003c/div>\u003cbutton id=\"loadLocalWorkspace\">Open workspace saved on this device\u003c/button>\u003clabel>Reopen workspace JSON\u003cinput id=\"workspaceFile\" type=\"file\" accept=\".json\">\u003c/label>\u003cbutton id=\"importWorkspace\">Open workspace\u003c/button>\u003cp id=\"mediaReminder\">\u003c/p>\u003ch2>Signing is a language, not an effect.\u003c/h2>\u003cp>Arrange a fluent signer’s interpretation and permission to use the recording. Ask Deaf viewers to review meaning, framing, pacing, and readability. ASL is the first learning pathway; this workspace can accompany other sign languages too.\u003c/p>\u003cp>\u003ca href=\"https://nad.org/knowledge-hub/american-sign-language/what-is-american-sign-language/\" target=\"_blank\" rel=\"noopener noreferrer\">Learn about ASL from the National Association of the Deaf ↗\u003c/a>\u003c/p>\u003c/main>\u003cscript type=\"module\">function validateCues(cues){\n if(!Array.isArray(cues)||cues.length>2000)throw Error('Use no more than 2,000 captions.');\n let end=0;\n return cues.map((c,i)=>{const start=Number(c.start),stop=Number(c.end);if(!Number.isFinite(start)||!Number.isFinite(stop)||start\u003c0||stop\u003c=start||start\u003cend)throw Error(`Caption ${i+1}: use increasing, non-overlapping times with end after start.`);if(typeof c.text!=='string'||!c.text.trim()||c.text.length>2000)throw Error(`Caption ${i+1}: add text (up to 2,000 characters).`);end=stop;return {start,end:stop,text:c.text.trim()}})\n}\nfunction timestamp(n,separator='.'){let ms=Math.round(n*1000);const h=Math.floor(ms/3600000);ms%=3600000;const m=Math.floor(ms/60000);ms%=60000;const s=Math.floor(ms/1000);return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')+separator+String(ms%1000).padStart(3,'0')}\nfunction parseCaptions(text){\n const time=t=>{if(!/^(?:\\d{2,}:)?\\d{2}:\\d{2}[.,]\\d{3}$/.test(t))throw Error('Use HH:MM:SS.mmm caption timestamps.');const a=t.replace(',','.').split(':').map(Number);if(a.at(-1)>=60||a.at(-2)>=60)throw Error('Caption minutes and seconds must be below 60.');return a.length===3?a[0]*3600+a[1]*60+a[2]:a[0]*60+a[1]};\n const blocks=text.replace(/^\\uFEFF/,'').replace(/\\r/g,'').trim().split(/\\n\\s*\\n/);const cues=[];\n for(const block of blocks){if(/^(WEBVTT|NOTE|STYLE|REGION)(\\s|$)/.test(block))continue;const lines=block.split('\\n');const i=lines.findIndex(l=>l.includes('-->'));if(i\u003c0)throw Error('Caption block has no timing line.');const m=lines[i].match(/^(\\S+)\\s+-->\\s+(\\S+)(?:\\s+.*)?$/);if(!m)throw Error('Invalid caption timing.');cues.push({start:time(m[1]),end:time(m[2]),text:lines.slice(i+1).join('\\n')})}\n return validateCues(cues)\n}\nfunction serialize(cues,format='vtt'){cues=validateCues(cues);return (format==='vtt'?'WEBVTT\\n\\n':'')+cues.map((c,i)=>(format==='srt'?`${i+1}\\n`:'')+timestamp(c.start,format==='srt'?',':'.')+' --> '+timestamp(c.end,format==='srt'?',':'.')+'\\n'+c.text).join('\\n\\n')+'\\n'}\n\nconst $=id=>document.getElementById(id),main=$('mainVideo'),sign=$('signVideo');let cues=[],mainName='',signName='',urls={},projectId=null;const note=t=>$('accessMessage').textContent=t;\nfunction render(){const container=$('cues');container.replaceChildren();cues.forEach((c,i)=>{const box=document.createElement('section');box.className='cue';const h=document.createElement('h3');h.textContent=`Caption ${i+1}`;box.append(h);const times=document.createElement('div');times.className='toolbar';for(const field of ['start','end']){const label=document.createElement('label');label.textContent=field==='start'?'Start (seconds)':'End (seconds)';const input=document.createElement('input');input.type='number';input.min='0';input.step='0.001';input.value=c[field];input.oninput=()=>{c[field]=input.value;preview()};label.append(input);times.append(label)}box.append(times);const l=document.createElement('label');l.textContent='Caption text';const t=document.createElement('textarea');t.maxLength=2000;t.rows=2;t.value=c.text;t.oninput=()=>{c.text=t.value;preview()};l.append(t);const remove=document.createElement('button');remove.textContent='Remove caption';remove.onclick=()=>{cues.splice(i,1);render();preview()};box.append(l,remove);container.append(box)})}\nfunction preview(){const c=cues.find(c=>Number(c.start)\u003c=main.currentTime&&main.currentTime\u003cNumber(c.end));$('captionPreview').textContent=c?.text||''}\nfunction settings(){return {offset:Number($('offset').value),size:Number($('signSize').value),position:$('signPosition').value,captionSize:Number($('captionSize').value)}}\nfunction layout(){const s=settings();sign.style.width=s.size+'%';sign.style.left=s.position==='left'?'0':'auto';sign.style.right=s.position==='right'?'0':'auto';$('captionPreview').style.fontSize=s.captionSize+'px';sync()}\nfunction sync(){preview();if(!urls.sign)return;const t=main.currentTime-Number($('offset').value);const ready=Number.isFinite(sign.duration)&&t>=0&&t\u003csign.duration;sign.hidden=!ready;if(!ready){sign.pause();return}if(Math.abs(sign.currentTime-t)>0.15)sign.currentTime=t;sign.playbackRate=main.playbackRate;if(!main.paused&&!main.ended)sign.play().catch(()=>note('Signer playback was blocked. Pause and press play again.'));else sign.pause()}\nfor(const e of ['timeupdate','seeking','seeked','play','pause','ended','ratechange'])main.addEventListener(e,sync);sign.addEventListener('loadedmetadata',sync);\nfor(const id of ['offset','signSize','signPosition','captionSize'])$(id).oninput=layout;\nfunction loadMedia(which,input){const f=input.files[0];if(!f)return;if(!f.type.startsWith('video/')){note('Choose a video file.');return}if(urls[which])URL.revokeObjectURL(urls[which]);urls[which]=URL.createObjectURL(f);const v=which==='main'?main:sign;v.src=urls[which];v.load();if(which==='main')mainName=f.name;else signName=f.name;note('Media selected for this browser session. Review timing before export.')}\n$('mainFile').onchange=()=>loadMedia('main',$('mainFile'));$('signFile').onchange=()=>loadMedia('sign',$('signFile'));for(const v of [main,sign])v.addEventListener('error',()=>note('This browser cannot play that video. Try a browser-compatible MP4.'));\n$('addCue').onclick=()=>{const start=Math.max(main.currentTime,Number(cues.at(-1)?.end)||0);cues.push({start,end:start+3,text:''});render()};\n$('importCaptions').onclick=async()=>{try{const f=$('captionFile').files[0];if(!f||f.size>2000000)throw Error('Select an SRT or VTT smaller than 2 MB.');const next=parseCaptions(await f.text());if(!next.length)throw Error('No captions found.');if(cues.length&&!confirm('Replace current captions with this file?'))return;cues=next;render();preview();note(`Imported ${cues.length} captions. Review the timing and wording.`)}catch(e){note(e.message)}};\nfunction download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}\nfunction checked(){const s=settings();if(!Number.isFinite(s.offset)||s.offset\u003c0)throw Error('Signer offset must be zero or positive.');const valid=validateCues(cues);if(!valid.length)throw Error('Add at least one caption before export.');if(Number.isFinite(main.duration)&&valid.at(-1).end>main.duration+0.05)throw Error('Captions extend beyond the selected video. Correct the end time.');return valid}\nfor(const [id,format] of [['downloadVtt','vtt'],['downloadSrt','srt']])$(id).onclick=()=>{try{download(serialize(checked(),format),'a2z-captions.'+format,'text/plain');note('Captions exported. Keep them with your video.')}catch(e){note(e.message)}};\n$('downloadTranscript').onclick=()=>{try{download(checked().map(c=>c.text).join('\\n\\n'),'a2z-transcript.txt','text/plain')}catch(e){note(e.message)}};\nfunction workspace(){return {format:'a2z-accessibility-v1',title:$('workspaceTitle').value.trim()||'Accessible story',media:{main:mainName,signer:signName},settings:settings(),cues:checked()}}\n$('downloadWorkspace').onclick=()=>{try{download(JSON.stringify(workspace(),null,2),'a2z-accessible-workspace.json','application/json');note('Workspace exported. Video files must be kept separately.')}catch(e){note(e.message)}};\n$('saveWorkspace').onclick=()=>{try{localStorage.setItem('a2z-accessibility-local-v1',JSON.stringify(workspace()));note('Workspace saved on this device. Download a backup before clearing browser data.')}catch(e){note('Could not save: '+e.message)}};\n$('loadLocalWorkspace').onclick=()=>{try{const d=localStorage.getItem('a2z-accessibility-local-v1');if(!d)throw Error('No saved workspace on this device yet.');if(cues.length&&!confirm('Replace the current workspace with the saved one?'))return;restore(JSON.parse(d));note('Saved workspace opened. Reselect original videos to preview.')}catch(e){note(e.message)}};\nfunction restore(d){if(d.format!=='a2z-accessibility-v1'||typeof d.title!=='string'||d.title.length>160||!d.settings||!d.media)throw Error('Invalid accessibility workspace.');const s=d.settings;if(!Number.isFinite(s.offset)||s.offset\u003c0||![30,40,50].includes(s.size)||!['left','right'].includes(s.position)||![20,28,36].includes(s.captionSize)||typeof d.media.main!=='string'||typeof d.media.signer!=='string')throw Error('Invalid workspace settings.');const next=validateCues(d.cues);main.pause();for(const [which,v] of [['main',main],['sign',sign]]){v.pause();v.removeAttribute('src');v.load();if(urls[which])URL.revokeObjectURL(urls[which])}urls={};sign.hidden=true;$('mainFile').value='';$('signFile').value='';cues=next;$('workspaceTitle').value=d.title;mainName=d.media.main;signName=d.media.signer;$('offset').value=s.offset;$('signSize').value=s.size;$('signPosition').value=s.position;$('captionSize').value=s.captionSize;$('mediaReminder').textContent=`Reselect media: ${mainName||'main video'}; ${signName||'no signer specified'}.`;render();layout()}\n$('importWorkspace').onclick=async()=>{try{const f=$('workspaceFile').files[0];if(!f||f.size>5000000)throw Error('Choose a workspace JSON smaller than 5 MB.');const d=JSON.parse(await f.text());if(cues.length&&!confirm('Replace this workspace? Download it first if you want to keep it.'))return;restore(d);projectId=null;note('Workspace opened. Select its original video files to preview.')}catch(e){note(e.message)}};\ntry{const saved=sessionStorage.getItem('a2z-accessibility-draft');if(saved){restore(JSON.parse(saved));projectId=sessionStorage.getItem('a2z-accessibility-project-id');sessionStorage.removeItem('a2z-accessibility-draft');sessionStorage.removeItem('a2z-accessibility-project-id')}}catch(e){note(e.message)}\n\ndocument.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const sections={'./':'create','./learn.html':'learn','./accessibility.html':'accessibility'};const target=sections[a.getAttribute('href')];if(target){e.preventDefault();parent.postMessage({a2zSection:target},parent.location.origin)}});\u003c/script>\u003c/body>\u003c/html>", "learning-project": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Learning projects · A2Z\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;background:#101426;color:#f4f6ff;font:16px system-ui,-apple-system,sans-serif}header{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#1b2138}header span{font-size:12px;color:#b6c2e4}main{max-width:700px;margin:auto;padding:26px 18px 90px}h1{font-size:30px}h2{font-size:20px;margin-top:35px}p{color:#bfc6d8;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{min-height:120px;font-size:30px}.grid b{display:block;font-size:17px;margin-top:12px}button{background:#28314d;border:1px solid #58658c;color:white;border-radius:14px;padding:15px;font:inherit;cursor:pointer}button:hover{border-color:#b8c5ff}button:disabled{opacity:.5}label{display:block;margin:20px 0;font-weight:700}input,textarea{display:block;width:100%;margin-top:8px;border:1px solid #57658b;border-radius:12px;background:#20283f;color:white;padding:14px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}#projects button{display:block;width:100%;text-align:left;margin:9px 0}#message{min-height:24px}a{color:#c4caff}\n\n[hidden]{display:none!important}nav{display:flex;gap:10px;flex-wrap:wrap;max-width:1000px;margin:auto;padding:16px 18px}nav a{padding:10px 16px;border:1px solid #58658c;border-radius:24px;text-decoration:none}main{max-width:1000px}h1{font-size:clamp(30px,6vw,50px);letter-spacing:-.04em}.eyebrow{color:#84e5d2;letter-spacing:.13em;font-size:12px;font-weight:700}select{display:block;width:100%;padding:14px;margin-top:8px;background:#20283f;border:1px solid #57658b;color:white;border-radius:12px;font:inherit}.toolbar{display:flex;gap:20px;flex-wrap:wrap}.toolbar>label{flex:1;min-width:180px}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.lesson-card{text-align:left;padding:24px;min-height:220px;background:linear-gradient(135deg,#27354b,#1c233a)}.lesson-card span{display:block;color:#84e5d2;font-size:14px;margin-bottom:20px}.lesson-card strong{font-size:24px;display:block}.lesson-card p{font-size:14px;line-height:1.6}.panel,#lesson{border:1px solid #465575;border-radius:20px;padding:24px;margin-top:28px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8bf1da;outline-offset:4px}.skip{position:absolute;left:0;top:-100px;background:#101426;padding:15px;z-index:5}.skip:focus{top:0}#stage{position:relative;background:#050713;border:1px solid #58658c;border-radius:16px;overflow:hidden;min-height:180px}#mainVideo{display:block;width:100%;max-height:550px}#signVideo{position:absolute;width:30%;right:0;bottom:50px;background:#000;max-height:60%;object-fit:contain}#captionPreview{position:absolute;top:8px;left:4%;width:92%;text-align:center;white-space:pre-wrap;pointer-events:none;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;background:#000d;border-radius:6px}#captionPreview:empty{display:none}.cue{border:1px solid #465575;border-radius:16px;padding:16px;margin:16px 0}.cue .toolbar label{min-width:100px}#accessMessage,#learningMessage{color:#8bf1da;white-space:pre-wrap}input[type=file]{font-size:14px}a{overflow-wrap:anywhere}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader>\u003cstrong>✦ A2Z Studio\u003c/strong>\u003cspan>Learn. Create. Include.\u003c/span>\u003c/header>\u003cnav aria-label=\"Main\">\u003ca href=\"./\">Create\u003c/a>\u003ca href=\"./learn.html\">Learn\u003c/a>\u003ca href=\"./accessibility.html\">Accessible video\u003c/a>\u003c/nav>\u003cmain id=\"main\">\u003cp class=\"eyebrow\">LEARNING INTO ART\u003c/p>\u003ch1>Make it yours.\u003c/h1>\u003cp>Write, reflect, and keep the project you started in Learn. These drafts save on this browser, separately from your original studio projects. Download a backup to keep a portable copy.\u003c/p>\u003clabel>Project name\u003cinput id=\"draftTitle\" maxlength=\"160\">\u003c/label>\u003clabel>Your words\u003ctextarea id=\"draftText\" rows=\"12\" maxlength=\"200000\">\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton id=\"saveDraft\">Save on this device\u003c/button>\u003cbutton id=\"downloadDraft\">Download text\u003c/button>\u003cbutton id=\"downloadDrafts\">Back up learning projects\u003c/button>\u003c/div>\u003cp id=\"draftMessage\" role=\"status\">\u003c/p>\u003ch2>Saved learning projects\u003c/h2>\u003cdiv id=\"drafts\">\u003c/div>\u003clabel>Restore learning projects backup\u003cinput id=\"draftBackup\" type=\"file\" accept=\".json\">\u003c/label>\u003cbutton id=\"restoreDrafts\">Restore backup\u003c/button>\u003c/main>\u003cscript type=\"module\">const $=id=>document.getElementById(id);let id=null;let projects=[];const key='a2z-learning-projects-v1';const note=t=>$('draftMessage').textContent=t;\ntry{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))projects=stored}catch{note('Saved drafts could not be loaded. Restore a backup if you have one.')}\nfunction render(){$('drafts').replaceChildren();for(const p of projects){const b=document.createElement('button');b.style.margin='8px';b.textContent=p.title;b.onclick=()=>{id=p.id;$('draftTitle').value=p.title;$('draftText').value=p.text};$('drafts').append(b)}}\n$('saveDraft').onclick=()=>{try{const p={id:id||crypto.randomUUID(),title:$('draftTitle').value.trim()||'Learning project',text:$('draftText').value};const next=projects.filter(x=>x.id!==p.id);next.unshift(p);localStorage.setItem(key,JSON.stringify(next));projects=next;id=p.id;render();note('Saved on this device.')}catch(e){note('Could not save. Download your text instead.')}};\nfunction download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}\n$('downloadDraft').onclick=()=>download($('draftTitle').value+'\\n\\n'+$('draftText').value,'a2z-learning-project.txt','text/plain');$('downloadDrafts').onclick=()=>download(JSON.stringify({format:key,projects},null,2),'a2z-learning-projects.json','application/json');\n$('restoreDrafts').onclick=async()=>{try{const f=$('draftBackup').files[0];if(!f||f.size>20000000)throw Error('Choose a JSON backup smaller than 20 MB.');const d=JSON.parse(await f.text());if(d.format!==key||!Array.isArray(d.projects)||d.projects.length>1000)throw Error('Invalid learning projects backup.');for(const p of d.projects)if(typeof p.id!=='string'||typeof p.title!=='string'||p.title.length>160||typeof p.text!=='string'||p.text.length>200000)throw Error('Invalid draft record.');const next=[...projects];for(const p of d.projects)if(!next.some(x=>x.id===p.id))next.push({id:p.id,title:p.title,text:p.text});localStorage.setItem(key,JSON.stringify(next));projects=next;render();note('Restored missing projects; existing projects were kept.')}catch(e){note(e.message)}};\ntry{const raw=sessionStorage.getItem('a2z-lesson-draft');if(raw){const d=JSON.parse(raw);$('draftTitle').value=d.title;$('draftText').value=d.content;sessionStorage.removeItem('a2z-lesson-draft')}}catch{note('Could not open learning draft. Return to Learn and try again.')}render();\n\ndocument.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const sections={'./':'create','./learn.html':'learn','./accessibility.html':'accessibility'};const target=sections[a.getAttribute('href')];if(target){e.preventDefault();parent.postMessage({a2zSection:target},parent.location.origin)}});\u003c/script>\u003c/body>\u003c/html>"};const education=document.getElementById('education');function a2zSection(section){if(section==='create'){show(false);return}if(!Object.hasOwn(a2zModules,section))return;document.getElementById('guide').style.display='none';document.getElementById('studio').style.display='none';document.getElementById('note').style.display='none';education.hidden=false;education.srcdoc=a2zModules[section];document.getElementById('guideBtn').classList.remove('active');document.getElementById('studioBtn').classList.remove('active')}document.getElementById('learnBtn').onclick=e=>{e.preventDefault();a2zSection('learn')};document.getElementById('accessibilityBtn').onclick=e=>{e.preventDefault();a2zSection('accessibility')};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===education.contentWindow&&e.data&&typeof e.data.a2zSection==='string')a2zSection(e.data.a2zSection)});</script></body></html>
